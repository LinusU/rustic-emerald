[package]
name = "rustic-emerald"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A native Rust desktop port of Pokémon Emerald"
publish = false

[features]
default = ["rust-game"]
rust-game = ["dep:emerald-game", "dep:pokemon-sprite-compression"]
# Developer oracle built by tools/compare-replay.py.
reference-c = []

[dependencies]
emerald-game = { path = "src/translated", optional = true }
pokemon-sprite-compression = { version = "0.1.4", optional = true }
sha1 = "0.10.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "=4.5.51", features = ["derive"] }
dirs = "5"
sdl2 = { version = "0.38", features = ["use-pkgconfig"] }
tempfile = "3.27"

[build-dependencies]
cc = "1"

# The original C game uses -fwrapv for signed arithmetic.
[profile.dev.package.emerald-game-01]
overflow-checks = false
[profile.dev.package.emerald-game-02]
overflow-checks = false
[profile.dev.package.emerald-game-03]
overflow-checks = false
[profile.dev.package.emerald-game-04]
overflow-checks = false
[profile.dev.package.emerald-game-05]
overflow-checks = false
